          { question: '"需要"和"想要"的区别是什么？', options: ['没有区别，都是想买的东西', '"需要"是生活必需的，"想要"是可有可无的', '"需要"是贵的，"想要"是便宜的'], answer: 1, tip: '买"需要"的东西，偶尔奖励自己"想要"的东西，但要控制比例。' },
          { question: '小明的压岁钱收到了2000元，以下哪种分配方式最合理？', options: ['一部分存起来，一部分用来买学习用品，一小部分作为零花', '全部存起来不动', '全部拿来买游戏装备'], answer: 0, tip: '压岁钱可以按"储蓄+消费+分享"的方式分配，学会规划。' },
          { question: '如果你借了同学10元钱，你应该怎么做？', options: ['假装忘记了', '等同学催了再还', '按时归还，信守承诺'], answer: 2, tip: '信用是人的无形资产，按时还钱才能赢得别人的信任。' },
          { question: '以下哪个是银行储蓄的主要好处？', options: ['钱会变多（获得利息）', '银行会送礼物', '存钱后就不能取出来了'], answer: 0, tip: '把钱存银行不仅安全，还能获得利息，让钱"生"钱。' },
          { question: '什么是"预算"？', options: ['随便花钱，花完再说', '提前计划好收入和支出的安排', '把钱藏起来'], answer: 1, tip: '做预算就像给钱做"行程表"，让你知道钱该花在哪儿。' },
          { question: '小明想买一个300元的书包，他每周零花钱是50元，如果每周存30元，需要几周才能买到？', options: ['6周', '10周', '15周'], answer: 1, tip: '通过计算和规划，你会明白攒钱需要耐心，也会更珍惜买到的物品。' },
          { question: '以下哪种做法能帮助你养成记账的好习惯？', options: ['每天记录收入和支出', '月底想起来再记', '不记，反正钱不多'], answer: 0, tip: '记账能让你清楚钱花在哪里，发现不必要的开支。' },
          { question: '"价格"和"价值"的关系，以下说法正确的是？', options: ['价格高的东西价值一定高', '价格低的东西没有价值', '价格不一定等于价值，要看你是否真的需要'], answer: 2, tip: '一件东西对你的价值，取决于你用它做什么，而不是它的标价。' },
          { question: '以下哪个是"理性消费"的表现？', options: ['看到别人买，自己也跟着买', '买东西前，先比较价格和质量', '只买最贵的东西'], answer: 1, tip: '理性消费就是"聪明地花钱"，不攀比，不盲从。' },
          { question: '什么是"通货膨胀"？', options: ['钱变得更值钱了', '物价上涨，钱的购买力下降', '银行利息变高'], answer: 1, tip: '简单说，就是以前10元能买的东西，现在可能要12元了。' },
          { question: '如果你中了100元彩票，以下哪种处理方式最明智？', options: ['马上全部花掉', '再买100元彩票', '拿出一部分庆祝，剩下的存起来或买需要的东西'], answer: 2, tip: '意外之财更要理性规划，而不是全部挥霍。' },
          { question: '关于"借钱消费"，以下说法正确的是？', options: ['借钱买东西很酷', '借钱消费要谨慎，因为需要还本付息，可能带来压力', '借钱不用还'], answer: 1, tip: '借钱容易还钱难，除非必要，尽量不借钱消费。' },
          { question: '以下哪个是"资产"？', options: ['能为你带来收入的东西，比如储蓄、出租的房子', '你欠别人的钱', '每天花掉的钱'], answer: 0, tip: '资产是能把钱放进你口袋的东西，负债是把钱从你口袋拿走的东西。' },
          { question: '你看到一款玩具，标价"原价200元，现价5折"，打完折是多少钱？', options: ['100元', '150元', '50元'], answer: 0, tip: '学会算折扣，能帮你判断是不是真的划算。' },
          { question: '以下哪个是"被动收入"？', options: ['帮爸妈做家务赚的钱', '存款利息', '过年收到的压岁钱'], answer: 1, tip: '被动收入就是你"躺着也能赚"的钱，比如利息、分红。' },
          { question: '如果你的朋友向你推荐一个"稳赚不赔"的投资项目，你应该怎么做？', options: ['马上投钱，机会难得', '借钱去投资', '保持警惕，世上没有稳赚不赔的事，先问家长'], answer: 2, tip: '凡是说"稳赚不赔"的，基本都是骗局。投资有风险，不懂不投。' },
          { question: '以下哪个是合理的"零花钱管理"方式？', options: ['周初花完，周末再找爸妈要', '分成"储蓄""消费""爱心"三份，按计划使用', '全部存起来，一分不花'], answer: 1, tip: '把钱分装在不同的"罐子"里，是培养理财习惯的好方法。' },
          { question: '什么是"复利"？', options: ['利息不产生利息', '利滚利，本金和利息一起继续生息', '银行扣的手续费'], answer: 1, tip: '复利被称为世界第八大奇迹，越早开始储蓄，复利效果越惊人。' },
          { question: '小红的妈妈给她100元让她去超市买一周的零食，以下哪种做法最合理？', options: ['先列个清单，按需购买，剩下的存起来', '第一天全部买完自己喜欢的零食', '买最便宜的零食，把钱省下来买玩具'], answer: 0, tip: '有计划的消费能让你既满足需求，又能学会节约。' },
          { question: '关于"捐赠"或"慈善"，以下说法正确的是？', options: ['只有有钱人才能做慈善', '在自己有能力的情况下，帮助有需要的人，是一种美德', '捐赠是浪费钱'], answer: 1, tip: '理财不仅是管好自己的钱，也包括用钱传递善意。' },
          { question: '如果你在网购时看到一个商品"限时秒杀"倒计时，你应该？', options: ['赶紧下单，慢了就没了', '不管需要不需要，先买下来再说', '先冷静，确认是否真的需要，再对比价格'], answer: 2, tip: '商家常用"限时""限量"制造紧迫感，不要被冲动牵着走。' },
          { question: '以下哪种情况属于"攀比消费"？', options: ['因为同学有最新款球鞋，所以自己也要买', '自己的鞋子坏了，买一双新鞋', '用自己的零花钱给妈妈买生日礼物'], answer: 0, tip: '为面子花钱，最后只会让自己"累"。' },
          { question: '"基金"是什么？', options: ['存钱罐', '一种将很多人钱集中起来，由专业的人去投资的方式', '银行送的小礼品'], answer: 1, tip: '基金适合没有太多投资经验的人，但仍需了解风险。' },
          { question: '以下哪个是"风险"在理财中的含义？', options: ['一定能赚钱', '银行倒闭', '投资可能亏钱的不确定性'], answer: 2, tip: '收益越高，风险通常也越高。保住本金是第一位的。' },
          { question: '小明想买一个200元的乐高，但他只有150元，以下哪种做法最合适？', options: ['向同学借钱，凑够200元买', '再攒一段时间，等钱够了再买', '让爸妈补贴，马上买'], answer: 1, tip: '通过自己攒钱买到的物品，你会更珍惜，也学会了为目标坚持。' },
          { question: '"信用记录"对一个人有什么影响？', options: ['没有影响', '只影响网购', '会影响未来贷款买房、买车等'], answer: 2, tip: '良好的信用记录是"经济身份证"，从小就要重视诚信。' },
          { question: '以下哪个是"保值"的意思？', options: ['让钱不变少，至少跑赢通货膨胀', '让钱翻倍', '把钱藏在家里'], answer: 0, tip: '如果钱存着不理财，通货膨胀会让它慢慢"缩水"。' },
          { question: '关于"赚钱"和"花钱"，以下哪种观念是正确的？', options: ['赚钱是大人的事，小孩只管花', '钱是通过劳动和智慧创造的，要珍惜每一分钱', '赚钱很容易，不用珍惜'], answer: 1, tip: '理解钱的来之不易，才能学会珍惜和感恩。' },
          { question: '钱存在家里比存在银行更安全。', options: ['正确', '错误'], answer: 1, tip: '银行受国家存款保险制度保护，存在银行更安全，还能获得利息。' },
          { question: '只要东西打折，就应该买，不管需不需要。', options: ['正确', '错误'], answer: 1, tip: '不需要的东西，哪怕免费也是一种浪费。' },
          { question: '学会记账能帮助我控制不必要的开支。', options: ['正确', '错误'], answer: 0, tip: '记账是理财的基础，能让你看清钱的去向。' },
          { question: '压岁钱是长辈的心意，我可以随意花，不用规划。', options: ['正确', '错误'], answer: 1, tip: '压岁钱是学习理财的好机会，合理规划能让它更有意义。' },
          { question: '借钱给朋友时，不用写借条，因为是朋友。', options: ['正确', '错误'], answer: 1, tip: '好朋友之间更要明算账，借条是保护双方权益的方式。' },
          { question: '如果我有100元，全部买成股票，一定能赚更多钱。', options: ['正确', '错误'], answer: 1, tip: '股票有涨有跌，可能赚钱也可能亏钱，不要把鸡蛋放在一个篮子里。' },
          { question: '存钱的目标越具体，越容易坚持下去。', options: ['正确', '错误'], answer: 0, tip: '比如"我要存500元买一本书"，比"我要存钱"更容易实现。' },
          { question: '买东西只挑最便宜的，不用考虑质量。', options: ['正确', '错误'], answer: 1, tip: '性价比才是关键，质量差的便宜货可能更"贵"。' },
          { question: '如果我不小心弄丢了同学的文具，应该主动赔偿。', options: ['正确', '错误'], answer: 0, tip: '承担责任是诚信的表现，也是财商的一部分。' },
          { question: '投资只是大人的事，小学生不需要了解。', options: ['正确', '错误'], answer: 1, tip: '从小了解投资的基本概念，长大后才能更好地理财。' },
          { question: '信用卡的钱是银行送的，可以随便花。', options: ['正确', '错误'], answer: 0, tip: '信用卡的钱是借来的，必须按时还，否则会影响信用。' },
          { question: '用自己的劳动换取报酬，比如做家务或摆摊，是体验赚钱的好方式。', options: ['正确', '错误'], answer: 0, tip: '劳动赚钱能让你更理解钱的来之不易。' },
          { question: '如果我有100元，我只花50元，剩下50元存起来，这叫"量入为出"。', options: ['正确', '错误'], answer: 1, tip: '花的钱不超过赚的钱，是理财的基本原则。' },
          { question: '商品的价格永远等于它的价值。', options: ['正确', '错误'], answer: 1, tip: '价格受供需、品牌等因素影响，不一定完全反映真实价值。' },
          { question: '我可以用零花钱给家人买小礼物，表达心意。', options: ['正确', '错误'], answer: 0, tip: '用钱表达爱和感恩，是金钱的正向价值。' },
          { question: '银行的利息和投资的分红，都属于"被动收入"。', options: ['正确', '错误'], answer: 1, tip: '被动收入让你不用工作也能有收入，是财务自由的基础。' },
          { question: '看到同学买了新东西，我也一定要买，不然会被笑话。', options: ['正确', '错误'], answer: 1, tip: '真正的自信不需要靠物品证明，不攀比是成熟的标志。' },
          { question: '如果我中了500万彩票，我可以不上学了。', options: ['正确', '错误'], answer: 1, tip: '金钱不能替代知识和能力，学习和成长才是一辈子的财富。' },
          { question: '通过参加"轻松赚钱"的广告，不用劳动就能赚大钱，这很可能是个骗局。', options: ['正确', '错误'], answer: 0, tip: '天上不会掉馅饼，任何"不劳而获"的承诺都要警惕。' },
          { question: '理财就是"怎么省钱"，和"怎么赚钱"没关系。', options: ['正确', '错误'], answer: 1, tip: '理财包括赚钱、花钱、存钱、投资、保障等，是一个完整的体系。' },
          
          // === 反诈小知识 (50题) ===
          { question: '你在玩手机游戏时，有陌生人发消息说"加QQ群免费领游戏皮肤"，你应该怎么做？', options: ['不相信，告诉家长并举报', '马上加群领取，机会难得', '先加群看看，如果不让充值再退出来'], answer: 0, tip: '免费领皮肤是中小学生被骗最多的套路！骗子会以"账号异常""未成年操作"为由恐吓你，让你用家长手机转账。' },
          { question: '你在二手平台看到有人低价卖高等级的"游戏账号"，对方让你直接微信转账，不要走平台，因为"平台手续费高"。此时你应该？', options: ['为了省钱直接微信转账', '坚持通过正规平台交易', '只要价格够低，怎么付都行'], answer: 1, tip: '凡是绕过正规平台私下交易的，基本都是诈骗。钱转过去后，对方可能直接拉黑，或者通过"账号找回"功能把卖给你的账号再拿回去。' },
          { question: '有人在游戏里自称是"代练"，说只要给他账号密码，就能帮你快速上分，你应该？', options: ['把账号密码给他，反正没什么钱', '给他一半密码，试探一下', '坚决不给，账号密码不能告诉任何人'], answer: 2, tip: '把账号密码告诉陌生人，不仅会被盗号，骗子还可能用你的账号去诈骗你的好友。' },
          { question: '你在QQ上收到好朋友"小明"发来的消息，说他受伤在医院急用钱，发了一个收款码，让你扫码转200元给他，你应该？', options: ['打电话或当面找小明核实', '朋友有难，马上转账', '先转一半，剩下的明天再说'], answer: 0, tip: '这是典型的冒充熟人诈骗。盗号后，骗子会群发消息借钱，一定要通过电话或见面核实。' },
          { question: '如果你的QQ或微信被盗，你应该第一时间怎么做？', options: ['不管它，反正号不要了', '赶紧通知亲朋好友，提醒他们不要上当，并尝试找回密码', '在空间发一条说说骂盗号的人'], answer: 1, tip: '第一时间通知亲友，可以防止骗子利用你的身份去骗你身边的人。' },
          { question: '有个网友和你聊了很久，你觉得很投缘，对方约你周末去公园见面，你应该？', options: ['一个人偷偷去赴约', '叫上同学一起去', '拒绝，并将情况告诉家长，网友见面风险极高'], answer: 2, tip: '网络对面的人性别、年龄、身份都可能是假的。中小学生绝对不要单独约见网友。' },
          { question: '你在短视频平台看到喜欢的明星过生日，评论区说"扫码进群领签名照和188元红包"，但扫码后提示"未成年人操作导致账户冻结"，需要拿家长手机"解冻"，这时你？', options: ['赶紧拿家长手机按对方说的做，不然要坐牢', '告诉家长，这是诈骗，千万不要转账', '很害怕，但先转一点试试看'], answer: 1, tip: '这是针对追星学生的精准诈骗。骗子利用"未成年导致公司账户冻结"等借口恐吓学生，诱导偷拿家长手机转账。' },
          { question: '你的"爱豆"（偶像）建了一个粉丝群，群主说充值99元可以返利999元，充得越多返得越多，这属于？', options: ['刷单返利类诈骗', '粉丝福利，明星宠粉', '正常的粉丝应援活动'], answer: 0, tip: '凡是"高额返利""充值返现"都是诈骗。明星不会在群里让你直接转账。' },
          { question: '你收到一条短信："恭喜你被抽中为幸运用户，获得笔记本电脑一台，点击链接填写信息即可领取。"你应该？', options: ['很开心，马上点击链接填写', '忽略或删除，不点击陌生链接', '转发给朋友一起领'], answer: 1, tip: '这是钓鱼短信。陌生链接不要点，可能会盗取你的个人信息或让手机中毒。' },
          { question: '在社交平台看到有人卖"超低价全新iPhone"，远低于市场价，卖家让你先付定金，你该怎么做？', options: ['天下没有免费的午餐，这很可能是骗局', '这么便宜，赶紧抢购', '付一半定金，赌一把'], answer: 0, tip: '贪小便宜吃大亏。网上购物一定要在正规平台进行，不要直接转账。' },
          { question: '接到自称是"公安局"的电话，说你涉嫌犯罪，要求你把钱转到"安全账户"配合调查，你应该？', options: ['很害怕，赶紧按他说的转钱', '告诉对方自己未成年，没钱', '挂断电话，告诉家长，警察不会在网上办案'], answer: 2, tip: '公检法机关绝不会通过电话办案，更没有"安全账户"。凡是让你转账到"安全账户"的都是诈骗。' },
          { question: '网上有人发消息说："我知道你在看不良网站，我控制了你的摄像头，给我转500元，否则把你的视频发给通讯录好友。"你应该？', options: ['觉得丢人，转账求放过', '不理会，这是诈骗，直接拉黑举报', '跟他砍价，少给一点'], answer: 1, tip: '这是"裸聊"敲诈的变种，但针对学生可能是"恐吓"诈骗。不要相信，直接拉黑，就算转了钱，对方还会继续勒索。' },
          { question: '以下哪个密码安全性最高？', options: ['123456', '生日日期', '字母+数字+符号组合，且不同账号不同密码'], answer: 2, tip: '简单的密码容易被黑客"撞库"破解。' },
          { question: '以下哪种行为最容易导致个人信息泄露？', options: ['在朋友圈晒没打码的火车票、飞机票', '下载国家反诈中心APP', '设置手机锁屏密码'], answer: 0, tip: '火车票上的二维码包含姓名、身份证号等信息，晒图前一定要打码。' },
          { question: '"验证码"相当于什么？', options: ['普通的数字串', '电子支付密码或身份证件，打死都不能告诉别人', '可以发给朋友帮他登录'], answer: 1, tip: '验证码是资金安全的最后一道防线。任何人（包括自称客服、警察的人）索要验证码，都是骗子。' },

          nextTimer = setTimeout(() => {
            if (gameActive && !gameFinished) {
              document.querySelectorAll('.option-btn').forEach((btn) => btn.classList.remove('disabled-touch'))
              displayQuestion()
            }
          }, 300)
        }

        function onOptionClick(e) {
          if (!gameActive || gameFinished || !canAnswer) return
          const selectedIdx = parseInt(e.currentTarget.dataset.optionIndex)
          const isCorrect = selectedIdx === currentQuestion.answer

          canAnswer = false
          document.querySelectorAll('.option-btn').forEach((btn) => btn.classList.add('disabled-touch'))

          let moveDelta = isCorrect ? MOVE_CORRECT : MOVE_WRONG
          let feedbackText = isCorrect ? `✅ 正确！` : `❌ 答错了…`

          // 播放音效
          if (isCorrect) {
            playCorrectSound()
            correctAnswers++
          } else {
            playWrongSound()
          }

          // 保存待处理结果
          pendingResult = { isCorrect, moveDelta }
          
          // 显示反馈
          feedbackMsg.textContent = feedbackText + (isCorrect ? ' ⭐' : '')

          // 显示反诈小贴士弹窗
          showTipModal(isCorrect, currentQuestion.tip, moveDelta)
        }

        function showWinScreen() {
          winScreen.classList.remove('hidden')
        }

        function fullReset() {
          if (nextTimer) {
            clearTimeout(nextTimer)
            nextTimer = null
          }
          playerPos = 0
          correctAnswers = 0
          gameFinished = false
          gameActive = true
          canAnswer = true
          usedQuestions.clear()
          pendingResult = null

          updatePlayerMarker()
          updateProgressUI()
          feedbackMsg.textContent = '✨ 新的一局！守护钱包，远离诈骗 ✨'
          startScreen.classList.add('hidden')
          winScreen.classList.add('hidden')

          currentQuestion = null
          currentQuestionIndex = -1
          displayQuestion()
        }

        function startNewGame() {
          fullReset()
          if (!musicPlaying) playMusic()
        }

        function playMusic() {
          bgMusic
            .play()
            .then(() => {
              musicPlaying = true
              musicToggle.textContent = '🎵 音乐 ▶️'
            })
            .catch((e) => {
              console.log('等待用户手势')
            })
        }
        function pauseMusic() {
          bgMusic.pause()
          musicPlaying = false
          musicToggle.textContent = '🎵 音乐 ⏸️'
        }
        function toggleMusic() {
          musicPlaying ? pauseMusic() : playMusic()
        }

        // 绑定确定按钮事件
        tipConfirmBtn.addEventListener('click', hideTipModalAndMove)

        startBtn.addEventListener('click', startNewGame)
        playAgainBtn.addEventListener('click', startNewGame)
        resetGameBtn.addEventListener('click', () => {
          if (nextTimer) clearTimeout(nextTimer)
          playerPos = 0
          correctAnswers = 0
          gameFinished = false
          gameActive = true
          canAnswer = true
          usedQuestions.clear()
          pendingResult = null
          updatePlayerMarker()
          updateProgressUI()
          startScreen.classList.add('hidden')
          winScreen.classList.add('hidden')
          feedbackMsg.textContent = '✨ 新的一局！加油 ✨'
          currentQuestion = null
          currentQuestionIndex = -1
          displayQuestion()
        })
        musicToggle.addEventListener('click', toggleMusic)

        renderBoard()
        updateProgressUI()
        bgMusic.volume = 0.4
        correctSound.volume = 0.6
        wrongSound.volume = 0.6

        gameActive = false
        questionText.textContent = '🛡️ 点击「开始闯关」学习反诈知识！'
        optionsDiv.innerHTML = ''

        resetGameBtn.addEventListener('click', function () {
          if (!gameActive && !gameFinished) {
            startNewGame()
          }
        })

        console.log('🛡️ 金融反诈大冒险已加载！题库共' + QUESTIONS.length + '道题')
      })()
    </script>
  
</body></html>
