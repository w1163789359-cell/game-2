            cell.style.gridRow = gridPos[0] + 1
            cell.style.gridColumn = gridPos[1] + 1

            cell.innerHTML = `<div class="cell-icon">${cellIcons[i]}</div><div class="cell-name">${cellLabels[i]}</div>`
            boardEl.appendChild(cell)
          }

          // 添加格子间的箭头
          setTimeout(() => {
            const boardRect = boardEl.getBoundingClientRect()
            const cellWidth = (boardRect.width - 20) / 5
            const cellHeight = (boardRect.height - 30) / 5

            // 箭头位置映射表（根据回形路径计算）
            const arrowPositions = [
              // 第1行 左→右 (0→1, 1→2, 2→3, 3→4)
              { row: 0.5, col: 1, arrow: '➡️' },
              { row: 0.5, col: 2.05, arrow: '➡️' },
              { row: 0.5, col: 3.05, arrow: '➡️' },
              { row: 0.5, col: 4.05, arrow: '➡️' },
              { row: 1, col: 4.55, arrow: '⬇️' }, // 转角
              // 右侧列 上→下 (4→5, 5→6, 6→7, 7→8)
              { row: 2, col: 4.55, arrow: '⬇️' },
              { row: 3.05, col: 4.55, arrow: '⬇️' },
              { row: 4.05, col: 4.55, arrow: '⬇️' },
              { row: 4.6, col: 4, arrow: '⬅️' }, // 转角
              // 底行 右→左 (8→9, 9→10, 10→11, 11→12)
              { row: 4.6, col: 3, arrow: '⬅️' },
              { row: 4.6, col: 2, arrow: '⬅️' },
              { row: 4.6, col: 1, arrow: '⬅️' },
              { row: 4.15, col: 0.55, arrow: '⬆️' }, // 转角
              // 左侧列 下→上 (12→13, 13→14, 14→15)
              { row: 3.05, col: 0.55, arrow: '⬆️' },
              { row: 2.05, col: 0.55, arrow: '⬆️' }, // 转角进入内圈
              // 第2行 左→右 (15→16, 16→17)
              { row: 1.55, col: 1, arrow: '➡️' },
              { row: 1.55, col: 2.05, arrow: '➡️' },
              { row: 1.55, col: 3.05, arrow: '➡️' },
              { row: 2.1, col: 3.55, arrow: '⬇️' }, // 转角
              // 内圈右侧 上→下 (17→18, 18→19)
              { row: 3.1, col: 3.55, arrow: '⬇️' },
              { row: 3.6, col: 3, arrow: '⬅️' },
              { row: 3.6, col: 2, arrow: '⬅️' }, // 转角
              // 内圈底行 右→左 (19→20)
              { row: 3.05, col: 1.5, arrow: '⬆️' }, // 转角
              // 内圈左侧 下→上 (20→21, 21→22)
              { row: 2.55, col: 2, arrow: '➡️' }, // 最后指向中心
            ]

            arrowPositions.forEach((pos) => {
              const arrowEl = document.createElement('div')
              arrowEl.className = 'board-arrow'
              arrowEl.textContent = pos.arrow
              arrowEl.style.position = 'absolute'
              arrowEl.style.left = `${(pos.col - 0.5) * cellWidth + cellWidth / 2}px`
              arrowEl.style.top = `${(pos.row - 0.5) * cellHeight + cellHeight / 2}px`
              arrowEl.style.transform = 'translate(-50%, -50%)'
              boardEl.appendChild(arrowEl)
            })
          }, 100)

          updatePlayerMarker()
        }

        function updatePlayerMarker() {
          document.querySelectorAll('.player-marker').forEach((el) => el.remove())
          const cells = document.querySelectorAll('.cell')
          if (cells[playerPos]) {
            const marker = document.createElement('div')
            marker.className = 'player-marker'
            marker.textContent = '👮'
            cells[playerPos].appendChild(marker)
          }
        }

        function updateProgressUI() {}

        function getRandomQuestion() {
          if (usedQuestions.size >= QUESTIONS.length) {
            usedQuestions.clear()
          }
          let idx
          do {
            idx = Math.floor(Math.random() * QUESTIONS.length)
          } while (usedQuestions.has(idx))
          usedQuestions.add(idx)
          return { question: QUESTIONS[idx], index: idx }
        }

        // 播放音效
        function playCorrectSound() {
          correctSound.currentTime = 0
          correctSound.volume = 0.6
          correctSound.play().catch(() => {})
        }

        function playWrongSound() {
          wrongSound.currentTime = 0
          wrongSound.volume = 0.6
          wrongSound.play().catch(() => {})
        }

        function displayQuestion() {
          if (!gameActive || gameFinished) return
          const { question: q, index } = getRandomQuestion()
          currentQuestion = q
          currentQuestionIndex = index
          questionText.textContent = q.question
          optionsDiv.innerHTML = ''
          q.options.forEach((opt, idx) => {
            const btn = document.createElement('div')
            btn.className = 'option-btn'
            btn.textContent = `${String.fromCharCode(65 + idx)}. ${opt}`
            btn.dataset.optionIndex = idx
            btn.addEventListener('click', onOptionClick)
            optionsDiv.appendChild(btn)
          })
          feedbackMsg.textContent = '🤔 仔细思考，选择正确答案！'
          canAnswer = true
        }

        // 显示反诈小贴士弹窗
        function showTipModal(isCorrect, tip, moveDelta) {
          if (isCorrect) {
            tipHeader.textContent = '🎉 反诈小贴士 - 答对啦！'
            tipHeader.className = 'tip-header correct'
          } else {
            tipHeader.textContent = '⚠️ 反诈小贴士 - 答错了'
            tipHeader.className = 'tip-header wrong'
          }

          tipContent.textContent = tip

          if (moveDelta > 0) {
            tipMove.textContent = `✅ 前进 ${moveDelta} 格！`
          } else {
            tipMove.textContent = `❌ 后退 ${Math.abs(moveDelta)} 格`
          }

          tipOverlay.classList.remove('hidden')
        }

        // 隐藏反诈小贴士弹窗并处理跳转
        function hideTipModalAndMove() {
          tipOverlay.classList.add('hidden')

          if (!pendingResult) return

          const { isCorrect, moveDelta } = pendingResult
          pendingResult = null

          // 执行移动
          let newPos = Math.max(0, Math.min(TOTAL_CELLS - 1, playerPos + moveDelta))
          playerPos = newPos
          updatePlayerMarker()

          // 检查通关
          if (correctAnswers >= WIN_CORRECT_COUNT) {
            gameFinished = true
            gameActive = false
            feedbackMsg.textContent = '🎈 恭喜！反诈小卫士通关！ 🎈'
            setTimeout(() => showWinScreen(), 500)
            return
          }
          if (playerPos === TOTAL_CELLS - 1) {
            gameFinished = true
            gameActive = false
            feedbackMsg.textContent = '🏆 抵达终点！反诈知识达人通关！ 🏆'
            setTimeout(() => showWinScreen(), 500)
            return
          }

          // 显示下一题
          if (nextTimer) clearTimeout(nextTimer)
          nextTimer = setTimeout(() => {
            if (gameActive && !gameFinished) {
              document.querySelectorAll('.option-btn').forEach((btn) => btn.classList.remove('disabled-touch'))
              displayQuestion()
            }
          }, 300)
        }

        function onOptionClick(e) {
          if (!gameActive || gameFinished || !canAnswer) return
          const selectedIdx = parseInt(e.currentTarget.dataset.optionIndex)
          const isCorrect = selectedIdx === currentQuestion.answer

          canAnswer = false
          document.querySelectorAll('.option-btn').forEach((btn) => btn.classList.add('disabled-touch'))

          let moveDelta = isCorrect ? MOVE_CORRECT : MOVE_WRONG
          let feedbackText = isCorrect ? `✅ 正确！` : `❌ 答错了…`

          // 播放音效
          if (isCorrect) {
            playCorrectSound()
            correctAnswers++
          } else {
            playWrongSound()
          }

          // 保存待处理结果
          pendingResult = { isCorrect, moveDelta }

          // 显示反馈
          feedbackMsg.textContent = feedbackText + (isCorrect ? ' ⭐' : '')

          // 显示反诈小贴士弹窗
          showTipModal(isCorrect, currentQuestion.tip, moveDelta)
        }

        function showWinScreen() {
          winScreen.classList.remove('hidden')
        }

        function fullReset() {
          if (nextTimer) {
            clearTimeout(nextTimer)
            nextTimer = null
          }
          playerPos = 0
          correctAnswers = 0
          gameFinished = false
          gameActive = true
          canAnswer = true
          usedQuestions.clear()
          pendingResult = null

          updatePlayerMarker()
          updateProgressUI()
          feedbackMsg.textContent = '✨ 新的一局！守护钱包，远离诈骗 ✨'
          startScreen.classList.add('hidden')
          winScreen.classList.add('hidden')

          currentQuestion = null
          currentQuestionIndex = -1
          displayQuestion()
        }

        function startNewGame() {
          fullReset()
          if (!musicPlaying) playMusic()
        }

        function playMusic() {
          bgMusic
            .play()
            .then(() => {
              musicPlaying = true
              musicToggle.textContent = '🎵 音乐 ▶️'
            })
            .catch((e) => {
              console.log('等待用户手势')
            })
        }
        function pauseMusic() {
          bgMusic.pause()
          musicPlaying = false
          musicToggle.textContent = '🎵 音乐 ⏸️'
        }
        function toggleMusic() {
          musicPlaying ? pauseMusic() : playMusic()
        }

        // 绑定确定按钮事件
        tipConfirmBtn.addEventListener('click', hideTipModalAndMove)

        startBtn.addEventListener('click', startNewGame)
        playAgainBtn.addEventListener('click', startNewGame)
        resetGameBtn.addEventListener('click', () => {
          if (nextTimer) clearTimeout(nextTimer)
          playerPos = 0
          correctAnswers = 0
          gameFinished = false
          gameActive = true
          canAnswer = true
          usedQuestions.clear()
          pendingResult = null
          updatePlayerMarker()
          updateProgressUI()
          startScreen.classList.add('hidden')
          winScreen.classList.add('hidden')
          feedbackMsg.textContent = '✨ 新的一局！加油 ✨'
          currentQuestion = null
          currentQuestionIndex = -1
          displayQuestion()
        })
        musicToggle.addEventListener('click', toggleMusic)

        renderBoard()
        updateProgressUI()
        bgMusic.volume = 0.4
        correctSound.volume = 0.6
        wrongSound.volume = 0.6

        gameActive = false
        questionText.textContent = '🛡️ 点击「开始闯关」学习反诈知识！'
        optionsDiv.innerHTML = ''

        resetGameBtn.addEventListener('click', function () {
          if (!gameActive && !gameFinished) {
            startNewGame()
          }
        })

        console.log('🛡️ 金融反诈大冒险已加载！题库共' + QUESTIONS.length + '道题')
      })()
    </script>
  </body>
</html>
